services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    volumes:
      - ./cad:/cad:ro
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.api:app --host 0.0.0.0 --port 8000"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Copy .env.example to .env}
      PGUSER: ${POSTGRES_USER:?Copy .env.example to .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:3000}
      SCAN_LOOKAHEAD_DAYS: ${SCAN_LOOKAHEAD_DAYS:-1}
      ESCALATION_HOURS: ${ESCALATION_HOURS:-4}
      SUPERINTENDENT_EMAIL: ${SUPERINTENDENT_EMAIL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-cached}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_CACHE_PATH: ${LLM_CACHE_PATH:-/app/demo/extraction-cache.json}
      QA_ROUTER_PROVIDER: ${QA_ROUTER_PROVIDER:-cached}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QA_CONFIDENCE_THRESHOLD: ${QA_CONFIDENCE_THRESHOLD:-0.6}
      MCP_URL: ${MCP_URL:-http://mcp:8001/mcp}
      TELEGRAM_COMPLIANCE_KEY: ${TELEGRAM_COMPLIANCE_KEY:-}
      TELEGRAM_RETENTION_DAYS: ${TELEGRAM_RETENTION_DAYS:-7}
      TELEGRAM_RESPONSIBLE: ${TELEGRAM_RESPONSIBLE:-SiteMind demo team}
      TELEGRAM_CREW_LEADS_JSON: ${TELEGRAM_CREW_LEADS_JSON:-}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./.gmail:/gmail
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      GMAIL_ENABLED: ${GMAIL_ENABLED:-false}
      GMAIL_SEND_ENABLED: ${GMAIL_SEND_ENABLED:-false}
      GMAIL_MAILBOX: ${GMAIL_MAILBOX:-}
      GMAIL_LABEL: ${GMAIL_LABEL-INBOX}
      GMAIL_TOKEN_FILE: ${GMAIL_TOKEN_FILE:-/gmail/token.json}
      GMAIL_POLL_SECONDS: ${GMAIL_POLL_SECONDS:-15}
      GMAIL_SENDER_ROLES_JSON: ${GMAIL_SENDER_ROLES_JSON:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHATS_JSON: ${TELEGRAM_ALLOWED_CHATS_JSON:-}
      TELEGRAM_ALLOWED_USERS_JSON: ${TELEGRAM_ALLOWED_USERS_JSON:-}
      TELEGRAM_SENDER_ROLES_JSON: ${TELEGRAM_SENDER_ROLES_JSON:-}
      TELEGRAM_SENDER_CREWS_JSON: ${TELEGRAM_SENDER_CREWS_JSON:-}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-2}
      TELEGRAM_COMPLIANCE_KEY: ${TELEGRAM_COMPLIANCE_KEY:-}
      MORNING_SCAN_TIME: ${MORNING_SCAN_TIME:-06:00}
      ESCALATION_CHECK_SECONDS: ${ESCALATION_CHECK_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy

  mcp:
    build: ./backend
    command: ["python", "-m", "app.mcp_server"]
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    ports:
      - "${MCP_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:

networks:
  database:
    internal: true
